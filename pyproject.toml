[project]
name = "indesia-rbe-anomalies"
version = "0.1.0"
description = "IndesIAhack 2026 - RBE Sales Anomaly Detection & Prioritization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5.3",
    "numpy>=1.23.5",
    "scipy>=1.10.0",
    "scikit-learn>=1.1.1",
    "lightgbm>=4.0.0",
    "statsmodels>=0.13.5",
    "plotly>=5.9.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.2",
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.0.0",
    "nbformat>=5.9.0",
    "pytest>=7.0.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
pg = [
    "psycopg[binary]>=3.1.0",
    "psycopg2-binary>=2.9.9",
]
databricks = [
    "databricks-sdk>=0.20.0",
    "databricks-sql-connector>=3.0.0",
    "openai>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["databricks/tests"]
pythonpath = ["."]
